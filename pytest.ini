[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    unit: Unit tests for core algorithms and modules
    api: Integration tests for Flask API routes
    e2e: End-to-end browser tests with Playwright
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
